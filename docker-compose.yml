# Servicios opcionales para desarrollo con Postgres real.
# Sin esto, la API arranca con PGlite embebido (ver .env.example).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: resan
      POSTGRES_PASSWORD: resan
      POSTGRES_DB: resan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
